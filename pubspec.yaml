name: skinsense
description: SkinSense - Aplikasi mobile klasifikasi tipe kulit wajah berbasis CNN dengan rekomendasi perawatan dan produk berbasis hybrid Fuzzy-SAW.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  image_picker: ^1.2.3
  google_mlkit_face_detection: ^0.14.0
  http: ^1.6.0
  image: ^4.13.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
